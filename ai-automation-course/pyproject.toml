[project]
name = "ai-automation-course"
version = "0.1.0"
description = "Advanced AI Automation course: business automations in Python on Google Cloud Run"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic[email]>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["automations"]
