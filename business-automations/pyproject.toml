[project]
name = "business-automations"
version = "0.1.0"
description = "Business automations as plain Python scripts on Cloud Run"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.75",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "pydantic[email]>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
