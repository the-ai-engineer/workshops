[project]
name = "business-automations"
version = "0.1.0"
description = "Business automations in code: short Python scripts on Cloud Run"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "google-genai>=2",
    "google-adk>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
